server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:h2:mem:products;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: ${spring.application.name}
    description: Product catalogue REST service
    version: 1.0.0

logging:
  level:
    com.jessicasales.microservices.product: INFO
    org.hibernate.SQL: WARN
