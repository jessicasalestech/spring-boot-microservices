server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Static routing: no service discovery required. Target URIs are
      # overridable with PRODUCT_SERVICE_URL / ORDER_SERVICE_URL at runtime.
      routes:
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/orders/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Spring Cloud Gateway for the microservices portfolio
    version: 1.0.0

logging:
  level:
    org.springframework.cloud.gateway: INFO