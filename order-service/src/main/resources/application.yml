server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    default-property-inclusion: non_null

# -----------------------------------------------------------------------------
# Downstream product-service contract.
# Override the URL in containers with PRODUCT_SERVICE_URL.
# -----------------------------------------------------------------------------
product-service:
  base-url: ${PRODUCT_SERVICE_URL:http://localhost:8081}
  connect-timeout: 2s
  read-timeout: 5s
  # When true, the RestClient bean is not created because a test stub supplies it.
  stub-client: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: ${spring.application.name}
    description: Order service
    version: 1.0.0

logging:
  level:
    com.jessicasales.microservices.order: INFO
